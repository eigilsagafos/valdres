name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
            - uses: oven-sh/setup-bun@v2
              with:
                  # Pinned to the Bencher benchmark runners (bencher-{base,pr}.yml)
                  # so the architecture/memory gates measure the same engines the
                  # perf lanes and their committed baselines are calibrated on.
                  bun-version: 1.3.14
            - uses: actions/setup-node@v6
              with:
                  node-version: "24.16"
            - name: Install
              run: bun install --frozen-lockfile
            - name: Require changeset
              if: github.event_name == 'pull_request'
              run: bunx changeset status --since=origin/main
            - name: Build
              run: bun run build
            - name: Build types
              run: bun run build:types
            - name: Typecheck (noUnusedLocals gate)
              # Type-checks every package's public source graph with noEmit,
              # enforcing the root tsconfig's noUnusedLocals flag so unused
              # imports/locals can't reaccumulate. Runs after build/build:types
              # because cross-package imports resolve through built dist/types.
              run: bun run typecheck
            - name: Typecheck type-level tests
              run: bun --filter 'valdres' typecheck:types
            - name: Ban unchecked TypeScript suppressions in valdres
              run: |
                  if git grep -n -E '^[[:space:]]*//[[:space:]]*@ts-ignore([[:space:]]|$)' -- packages/valdres/src; then
                      echo "::error::Use @ts-expect-error with a specific reason instead of @ts-ignore"
                      exit 1
                  fi
            - name: Deterministic architecture gates
              run: bun --filter 'valdres' test:architecture
            - name: Rewrite guards (Node/V8)
              # Consumer V8 can expose oracle and matcher assumptions hidden by
              # Bun/JSC. Parse JUnit too, so empty collection cannot pass quietly.
              run: |
                  report="$RUNNER_TEMP/valdres-rewrite-guards.xml"

                  set +e
                  bun --filter 'valdres' test:rewrite-guards:node -- \
                      --reporter=default \
                      --reporter=junit \
                      --outputFile.junit="$report"
                  vitest_status=$?
                  set -e

                  node - "$report" <<'NODE'
                  const fs = require('fs');
                  const report = process.argv[2];
                  const xml = fs.readFileSync(report, 'utf8');
                  const testCount = [...xml.matchAll(/<testsuite\b[^>]*\btests="(\d+)"/g)]
                      .reduce((total, match) => total + Number(match[1]), 0);

                  console.log(`Node/V8 rewrite guards collected ${testCount} tests.`);
                  if (testCount === 0) {
                      console.error('::error::Node/V8 rewrite-guard lane collected zero tests');
                      process.exit(1);
                  }
                  NODE

                  exit "$vitest_status"
            - name: Retained-memory gates (Bun)
              run: bun --filter 'valdres' test:memory:bun
            - name: Retained-memory gates (Node)
              run: bun --filter 'valdres' test:memory:node
            - name: Lint valdres-svelte publish artifact
              # Svelte libraries must ship uncompiled source + the `svelte` export
              # condition; publint packs the real tarball and svelte-check
              # type-checks the emitted d.ts, so a regression to the broken
              # bundled-runes artifact (or a dropped condition) fails the PR.
              run: bun --filter 'valdres-svelte' lint:publish
            - name: Verify publish (dry-run)
              run: DRY_RUN=1 bash scripts/ci-publish.sh
            - name: Verify publish cleanup
              run: |
                  git diff --exit-code -- 'packages/**/package.json'

                  stray_backups="$(find packages -name package.tmp.json -not -path '*/node_modules/*' -print)"
                  if [ -n "$stray_backups" ]; then
                      echo "::error::Publish dry-run left package.tmp.json backup files behind"
                      echo "$stray_backups"
                      exit 1
                  fi
            - name: Benchmark tooling tests
              # scripts/ is intentionally not a workspace, so the root
              # `bun --filter '*' test` sweep never reaches these; run the
              # benchmark converter + Bencher fetch tests explicitly. The
              # bunfig `[test].preload` guard blocks root-level `bun test`, so
              # opt this legitimate scripts/ run in (see scripts/no-root-bun-test.ts).
              run: VALDRES_ALLOW_ROOT_BUN_TEST=1 bun test scripts/
            - name: Test
              id: test
              run: bun run test:ci
              continue-on-error: true
            - name: Test Report
              if: always()
              uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('fs');
                      const { execFileSync, execSync } = require('child_process');

                      const testStepFailed = '${{ steps.test.outcome }}' === 'failure';

                      // A package with a runnable test script must produce a
                      // JUnit file. Include test-bearing packages from the
                      // event base so deleting a test script cannot silently
                      // remove coverage. Exact `echo 'no tests'` placeholders
                      // are the explicit opt-out for packages without a suite;
                      // they do not emit JUnit output.
                      const expectedPackages = new Set();
                      const addTestPackages = (manifests, readManifest) => {
                          for (const manifest of manifests) {
                              try {
                                  const json = JSON.parse(readManifest(manifest));
                                  const testScript = json.scripts?.test;
                                  const isNoTestPlaceholder = /^echo\s+(['"])no tests\1$/.test(testScript || '');
                                  if (typeof testScript === 'string' && !isNoTestPlaceholder) {
                                      expectedPackages.add(manifest.replace(/^packages\//, '').replace(/\/package\.json$/, ''));
                                  }
                              } catch (error) {
                                  core.warning(`Could not inspect ${manifest}: ${error.message}`);
                              }
                          }
                      };

                      const currentManifests = execSync("find packages -name package.json -not -path '*/node_modules/*' -print")
                          .toString().trim().split('\n').filter(Boolean);
                      const currentManifestSet = new Set(currentManifests);
                      addTestPackages(currentManifests, manifest => fs.readFileSync(manifest, 'utf8'));

                      // PR checkouts have full history, so compare against the
                      // base there. Push checkouts are depth 1 and rely on the
                      // already-required PR check plus current-manifest coverage.
                      const baseSha = context.eventName === 'pull_request'
                          ? context.payload.pull_request?.base?.sha || ''
                          : '';
                      if (/^[0-9a-f]{40}$/i.test(baseSha) && !/^0+$/.test(baseSha)) {
                          const baseManifests = execFileSync('git', [
                              'ls-tree', '-r', '--name-only', baseSha, '--', 'packages'
                          ]).toString().trim().split('\n')
                              .filter(manifest =>
                                  manifest.endsWith('/package.json') && currentManifestSet.has(manifest)
                              );
                          addTestPackages(baseManifests, manifest =>
                              execFileSync('git', ['show', `${baseSha}:${manifest}`], { encoding: 'utf8' })
                          );
                      }

                      // Find all junit XML files
                      const files = execSync("find packages -name 'junit*.xml' -not -path '*/node_modules/*'")
                          .toString().trim().split('\n').filter(Boolean);

                      if (files.length === 0) {
                          const title = 'No test results found';
                          const summary = '⚠️ No JUnit XML files were produced. Tests may have crashed before completing.';
                          await github.rest.checks.create({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              name: `${context.workflow} / ${context.job} (${context.eventName}) — results`,
                              head_sha: context.sha,
                              status: 'completed',
                              conclusion: 'failure',
                              output: { title, summary }
                          });
                          core.setFailed(title);
                          return;
                      }

                      // Aggregate results by package
                      const pkgMap = new Map();
                      for (const file of files) {
                          const content = fs.readFileSync(file, 'utf8');
                          const pkg = file.replace(/^packages\//, '').replace(/\/junit.*\.xml$/, '');
                          const tests = parseInt(content.match(/tests="(\d+)"/)?.[1] || '0');
                          const failures = parseInt(content.match(/failures="(\d+)"/)?.[1] || '0');
                          const skipped = parseInt(content.match(/skipped="(\d+)"/)?.[1] || '0');
                          const time = parseFloat(content.match(/time="([\d.]+)"/)?.[1] || '0');

                          if (pkgMap.has(pkg)) {
                              const existing = pkgMap.get(pkg);
                              existing.tests += tests;
                              existing.failures += failures;
                              existing.skipped += skipped;
                              existing.time += time;
                          } else {
                              pkgMap.set(pkg, { tests, failures, skipped, time });
                          }
                      }

                      const missingPackages = [...expectedPackages]
                          .filter(pkg => !pkgMap.has(pkg))
                          .sort();

                      let totalTests = 0, totalFailures = 0, totalSkipped = 0, totalTime = 0;
                      for (const p of pkgMap.values()) {
                          totalTests += p.tests;
                          totalFailures += p.failures;
                          totalSkipped += p.skipped;
                          totalTime += p.time;
                      }

                      const passed = totalTests - totalFailures - totalSkipped;
                      const hasFailed = totalFailures > 0 || testStepFailed || missingPackages.length > 0;
                      const conclusion = hasFailed ? 'failure' : 'success';
                      const icon = hasFailed ? '❌' : '✅';
                      const title = `${totalTests} tests run, ${passed} passed, ${totalSkipped} skipped, ${totalFailures} failed`;

                      let summary = `## ${icon} Test Results\n\n`;
                      summary += `| Package | Tests | Passed | Skipped | Failed | Time |\n`;
                      summary += `|---------|------:|-------:|--------:|-------:|-----:|\n`;
                      for (const [pkg, p] of pkgMap) {
                          const pPassed = p.tests - p.failures - p.skipped;
                          const pIcon = p.failures > 0 ? '❌' : '✅';
                          summary += `| ${pIcon} ${pkg} | ${p.tests} | ${pPassed} | ${p.skipped} | ${p.failures} | ${p.time.toFixed(2)}s |\n`;
                      }
                      summary += `\n**Total: ${totalTests} tests, ${passed} passed, ${totalSkipped} skipped, ${totalFailures} failed in ${totalTime.toFixed(2)}s**`;
                      if (missingPackages.length > 0) {
                          summary += `\n\n### ❌ Missing JUnit results\n\n`;
                          summary += missingPackages.map(pkg => `- \`${pkg}\``).join('\n');
                      }

                      await github.rest.checks.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          name: `${context.workflow} / ${context.job} (${context.eventName}) — results`,
                          head_sha: context.sha,
                          status: 'completed',
                          conclusion,
                          output: { title, summary }
                      });

                      fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

                      if (hasFailed) {
                          const reasons = [];
                          if (totalFailures > 0) reasons.push(`${totalFailures} test(s) failed`);
                          if (testStepFailed) reasons.push('test command failed');
                          if (missingPackages.length > 0) {
                              reasons.push(`${missingPackages.length} package(s) produced no JUnit results`);
                          }
                          core.setFailed(reasons.join('; '));
                      }
            - name: Fail if tests failed
              if: steps.test.outcome == 'failure'
              run: exit 1

    valdres-package:
        name: Valdres published-package gate
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Detect package and publishing changes
              if: github.event_name == 'pull_request'
              id: changes
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      package:
                        - 'packages/valdres/**'
                        - 'scripts/check-valdres-package.ts'
                        - 'scripts/check-package-size.ts'
                        - 'scripts/size-baseline.json'
                        - 'scripts/prepack.ts'
                        - 'scripts/postpublish.ts'
                        - 'scripts/publish-metadata.ts'
                        - 'scripts/rewrite-declaration-imports.ts'
                        - 'scripts/verify-publish.ts'
                        - 'scripts/ci-publish.sh'
                        - 'package.json'
                        - 'bun.lock'
                        - '.github/workflows/ci.yaml'
            - uses: oven-sh/setup-bun@v2
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              with:
                  bun-version: 1.3.14
            - uses: actions/setup-node@v6
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              with:
                  # Active Node LTS; the smoke check runs this executable.
                  node-version: "24.16"
            - name: Install
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              run: bun install --frozen-lockfile
            - name: Prove red, then validate the single npm tarball
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              # Builds valdres, invokes npm pack once, proves every validator
              # rejects its targeted mutation, then runs the intact artifact
              # through publint, ATTW, TS resolution, Node/Bun runtime smokes,
              # browser/worker-target consumer builds, and committed budgets.
              run: bun run scripts/check-valdres-package.ts --build --self-test

    publish:
        needs: [test, valdres-package]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-22.04
        environment: npm-publish
        permissions:
            checks: write
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  # Match the test job / Bencher runners so the frozen-lockfile
                  # gate sees identical lockfile behavior across both lanes.
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build all packages
              run: bun run build

            - name: Build types
              run: bun run build:types

            - name: Verify publish pipeline
              run: bun run verify-publish

            - name: Configure npm auth
              # Write the token to $HOME/.npmrc, not the workspace, so it can never
              # be swept into a commit by `git add .` (which is what changesets/action
              # does when opening the Version Packages PR — see PR #123 fallout).
              run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$HOME/.npmrc"

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@v1
              with:
                  version: bun run version-packages
                  publish: bash scripts/ci-publish.sh
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            # Pull requests created with GITHUB_TOKEN can require approval and
            # do not reliably emit the workflow_run event used by the trusted
            # benchmark gate. Version PRs cannot affect runtime performance,
            # so pre-authorize only the exact commit after proving that every
            # changed path is generated release metadata.
            - name: Mark generated release pull request benchmark-safe
              if: steps.changesets.outputs.pullRequestNumber != ''
              uses: actions/github-script@v9
              env:
                  RELEASE_PR_NUMBER:
                      ${{ steps.changesets.outputs.pullRequestNumber }}
              with:
                  script: |
                      const pullNumber = Number(process.env.RELEASE_PR_NUMBER);
                      if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
                          throw new Error('Changesets returned an invalid pull request number');
                      }

                      const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
                      const [{ stdout: shaOutput }, { stdout: branchOutput }] = await Promise.all([
                          exec.getExecOutput('git', ['rev-parse', 'HEAD'], { silent: true }),
                          exec.getExecOutput('git', ['branch', '--show-current'], { silent: true })
                      ]);
                      const releaseSha = shaOutput.trim();
                      const releaseBranch = branchOutput.trim();
                      if (!/^[0-9a-f]{40}$/i.test(releaseSha) ||
                          releaseBranch !== 'changeset-release/main') {
                          throw new Error('Changesets did not leave the trusted release commit checked out');
                      }

                      // The force-push can become visible through the Git ref API
                      // before the pull-request API refreshes its cached head SHA.
                      // Require both views to converge on the exact local commit.
                      let converged = false;
                      let lastPullSha = 'unknown';
                      let lastRefSha = 'unknown';
                      for (let attempt = 1; attempt <= 15; attempt++) {
                          const [pullResponse, refResponse] = await Promise.all([
                              github.rest.pulls.get({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  pull_number: pullNumber
                              }),
                              github.rest.git.getRef({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  ref: 'heads/changeset-release/main'
                              })
                          ]);
                          const candidate = pullResponse.data;
                          const branch = refResponse.data;
                          lastPullSha = candidate.head.sha;
                          lastRefSha = branch.object.sha;
                          if (candidate.state !== 'open' ||
                              candidate.base.ref !== 'main' ||
                              candidate.base.repo.full_name !== expectedRepository ||
                              candidate.head.repo.full_name !== expectedRepository ||
                              candidate.head.ref !== releaseBranch) {
                              throw new Error('Changesets pull request identity is not trusted');
                          }
                          if (candidate.head.sha === releaseSha &&
                              branch.object.type === 'commit' &&
                              branch.object.sha === releaseSha) {
                              converged = true;
                              break;
                          }
                          if (attempt < 15) {
                              await new Promise(resolve => setTimeout(resolve, 2000));
                          }
                      }
                      if (!converged) {
                          throw new Error(
                              `Changesets APIs did not converge on ${releaseSha}; ` +
                              `pull=${lastPullSha}, ref=${lastRefSha}`
                          );
                      }

                      const files = await github.paginate(
                          github.rest.pulls.listFiles,
                          {
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              pull_number: pullNumber,
                              per_page: 100
                          }
                      );
                      if (files.length === 0 || files.length > 500) {
                          throw new Error(`Unexpected generated release file count: ${files.length}`);
                      }
                      const generatedReleasePath = path =>
                          path === '.changeset/pre.json' ||
                          /^\.changeset\/[a-z0-9-]+\.md$/.test(path) ||
                          path === 'bun.lock' ||
                          /^packages\/(?:@[^/]+\/)?[^/]+\/(?:CHANGELOG\.md|package\.json)$/.test(path);
                      const unexpected = files
                          .map(file => file.filename)
                          .filter(path => !generatedReleasePath(path));
                      if (unexpected.length > 0) {
                          throw new Error(
                              `Refusing benchmark check for non-release files: ${unexpected.join(', ')}`
                          );
                      }
                      if (!files.some(file => /\/package\.json$/.test(file.filename))) {
                          throw new Error('Generated release pull request has no package manifest');
                      }

                      await github.rest.checks.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          name: 'benchmark_pr',
                          head_sha: releaseSha,
                          status: 'completed',
                          conclusion: 'success',
                          details_url: `${context.serverUrl}/${expectedRepository}/actions/runs/${context.runId}`,
                          output: {
                              title: 'Generated release metadata only',
                              summary: 'Trusted main-branch workflow verified that this commit changes generated release metadata only.'
                          }
                      });
