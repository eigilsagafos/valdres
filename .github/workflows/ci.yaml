name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v6
              with:
                  # The v1 provenance gate resolves the pinned beta.23 source and
                  # release commits directly, including on pushes to main.
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  # Pinned to the repository toolchain and Bencher runners so
                  # certified builds and the separate performance workflows use
                  # the same Bun release.
                  bun-version: 1.4.0
            - uses: actions/setup-node@v6
              with:
                  node-version: "24.16"
            - name: Install
              run: bun install --frozen-lockfile
            - name: Require changeset
              # A Changesets Version Packages PR consumes the changeset that
              # created it, so its release metadata diff cannot carry another
              # changeset. All ordinary PRs still run the gate.
              if:
                  github.event_name == 'pull_request' &&
                  (github.event.pull_request.head.repo.full_name !=
                  github.repository || github.head_ref !=
                  'changeset-release/main')
              run: bunx changeset status --since=origin/main
            - name: V1 contracts and migration ledger
              run: bun run check:contracts-v1
            - name: Build
              run: bun run build
            - name: Build types
              run: bun run build:types
            - name: Typecheck (noUnusedLocals gate)
              # Type-checks the certified core + React public source graphs.
              # Deferred packages retain an explicit `typecheck:all`
              # maintenance lane but cannot block this beta train.
              run: bun run typecheck
            - name: Typecheck v1 public candidate
              run:
                  bunx tsgo --noEmit -p
                  packages/valdres/test/v1-public-candidate/tsconfig.json
            - name: V1 ShiftX packed core-load gate
              # The required Bencher check still tracks the archived legacy
              # microbenchmarks. This separately executes the packed v1 runtime
              # through the exact frozen ShiftX workload in fresh Node processes
              # with broad, cross-runner catastrophic ceilings.
              run: bun --filter 'valdres' test:core-load-harness
            - name: V1 model contract
              # Proves the pure state/selector model before the evaluator and
              # committed StoreTree host exercise it through their own lanes.
              run: bun --filter 'valdres' test:v1-model
            - name: V1 selector evaluator contract
              # The evaluator remains unexported, so this dedicated lane proves
              # its host fixtures and independent symbolic oracle are both
              # typechecked before the future Store kernel can integrate it.
              run: bun --filter 'valdres' test:v1-selector-evaluator
            - name: V1 committed StoreTree host contract
              # This first persistent host is also intentionally outside every
              # package entrypoint, so its dedicated tsconfig must run explicitly.
              run: bun --filter 'valdres' test:v1-committed-store-tree
            - name: Ban unchecked TypeScript suppressions in valdres
              run: |
                  if git grep -n -E '^[[:space:]]*//[[:space:]]*@ts-ignore([[:space:]]|$)' -- packages/valdres/src; then
                      echo "::error::Use @ts-expect-error with a specific reason instead of @ts-ignore"
                      exit 1
                  fi
            - name: Release infrastructure tests
              # These root-owned tests cover the CI planner, Changesets cohort,
              # JUnit gate, docs freeze, package metadata, and publish scripts.
              # They are intentionally separate from the two certified package
              # suites below, which cannot discover files under scripts/.
              run: VALDRES_ALLOW_ROOT_BUN_TEST=1 bun test scripts/
            - name: Generated READMEs stay in sync
              # The legacy public site is frozen during this beta, but the root,
              # core, and React package READMEs are part of the shipped package
              # experience and remain deterministic generated artifacts.
              run: bun run scripts/gen-readmes.ts --check
            - name: Verify publish (dry-run)
              run: DRY_RUN=1 bash scripts/ci-publish.sh
            - name: Verify publish cleanup
              run: |
                  git diff --exit-code -- 'packages/**/package.json'

                  stray_backups="$(find packages -name package.tmp.json -not -path '*/node_modules/*' -print)"
                  if [ -n "$stray_backups" ]; then
                      echo "::error::Publish dry-run left package.tmp.json backup files behind"
                      echo "$stray_backups"
                      exit 1
                  fi
            - name: Clear stale JUnit reports
              # A no-op on CI's fresh checkout; the point is local. `junit*.xml`
              # is gitignored and never cleaned, so a report left by an earlier
              # run would satisfy the coverage gate below for a package that has
              # since stopped emitting one — `bun run verify` green, CI red.
              # Living here rather than in verify means both run the same thing.
              run:
                  find packages -name 'junit*.xml' -not -path '*/node_modules/*'
                  -delete
            - name: Test
              id: test
              run: bun run test:ci
              continue-on-error: true
            - name: JUnit coverage gate
              # Each certified package with a runnable test script must emit a report;
              # `bun run test:ci` can exit 0 while one produces nothing. This
              # used to live only inside the github-script step below, where no
              # local command could run it — so `bun run verify` reported green
              # on a CI-red checkout. As an ordinary shell step, verify picks it
              # up from this file like every other step.
              run: bun run scripts/check-junit-coverage.ts
            - name: Test Report
              if: always()
              uses: actions/github-script@v9
              with:
                  script: |
                      const fs = require('fs');
                      const { execFileSync, execSync } = require('child_process');

                      const testStepFailed = '${{ steps.test.outcome }}' === 'failure';

                      // Which packages owe a JUnit file is decided by
                      // scripts/check-junit-coverage.ts, the same module the
                      // "JUnit coverage gate" step above enforces and that
                      // `bun run verify` runs locally. `--json` is a pure query
                      // that always exits 0; the gate step is what fails the
                      // job. One implementation, so the summary below can never
                      // disagree with the gate.
                      const expectedPackages = new Set(
                          JSON.parse(
                              execFileSync('bun', [
                                  'run', 'scripts/check-junit-coverage.ts', '--json'
                              ], { encoding: 'utf8' })
                          ).expected
                      );

                      // Find all junit XML files
                      const files = execSync("find packages -name 'junit*.xml' -not -path '*/node_modules/*'")
                          .toString().trim().split('\n').filter(Boolean);

                      if (files.length === 0) {
                          const title = 'No test results found';
                          const summary = '⚠️ No JUnit XML files were produced. Tests may have crashed before completing.';
                          await github.rest.checks.create({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              name: `${context.workflow} / ${context.job} (${context.eventName}) — results`,
                              head_sha: context.sha,
                              status: 'completed',
                              conclusion: 'failure',
                              output: { title, summary }
                          });
                          core.setFailed(title);
                          return;
                      }

                      // Aggregate results by package
                      const pkgMap = new Map();
                      for (const file of files) {
                          const content = fs.readFileSync(file, 'utf8');
                          const pkg = file.replace(/^packages\//, '').replace(/\/junit.*\.xml$/, '');
                          const tests = parseInt(content.match(/tests="(\d+)"/)?.[1] || '0');
                          const failures = parseInt(content.match(/failures="(\d+)"/)?.[1] || '0');
                          const skipped = parseInt(content.match(/skipped="(\d+)"/)?.[1] || '0');
                          const time = parseFloat(content.match(/time="([\d.]+)"/)?.[1] || '0');

                          if (pkgMap.has(pkg)) {
                              const existing = pkgMap.get(pkg);
                              existing.tests += tests;
                              existing.failures += failures;
                              existing.skipped += skipped;
                              existing.time += time;
                          } else {
                              pkgMap.set(pkg, { tests, failures, skipped, time });
                          }
                      }

                      const missingPackages = [...expectedPackages]
                          .filter(pkg => !pkgMap.has(pkg))
                          .sort();

                      let totalTests = 0, totalFailures = 0, totalSkipped = 0, totalTime = 0;
                      for (const p of pkgMap.values()) {
                          totalTests += p.tests;
                          totalFailures += p.failures;
                          totalSkipped += p.skipped;
                          totalTime += p.time;
                      }

                      const passed = totalTests - totalFailures - totalSkipped;
                      const hasFailed = totalFailures > 0 || testStepFailed || missingPackages.length > 0;
                      const conclusion = hasFailed ? 'failure' : 'success';
                      const icon = hasFailed ? '❌' : '✅';
                      const title = `${totalTests} tests run, ${passed} passed, ${totalSkipped} skipped, ${totalFailures} failed`;

                      let summary = `## ${icon} Test Results\n\n`;
                      summary += `| Package | Tests | Passed | Skipped | Failed | Time |\n`;
                      summary += `|---------|------:|-------:|--------:|-------:|-----:|\n`;
                      for (const [pkg, p] of pkgMap) {
                          const pPassed = p.tests - p.failures - p.skipped;
                          const pIcon = p.failures > 0 ? '❌' : '✅';
                          summary += `| ${pIcon} ${pkg} | ${p.tests} | ${pPassed} | ${p.skipped} | ${p.failures} | ${p.time.toFixed(2)}s |\n`;
                      }
                      summary += `\n**Total: ${totalTests} tests, ${passed} passed, ${totalSkipped} skipped, ${totalFailures} failed in ${totalTime.toFixed(2)}s**`;
                      if (missingPackages.length > 0) {
                          summary += `\n\n### ❌ Missing JUnit results\n\n`;
                          summary += missingPackages.map(pkg => `- \`${pkg}\``).join('\n');
                      }

                      await github.rest.checks.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          name: `${context.workflow} / ${context.job} (${context.eventName}) — results`,
                          head_sha: context.sha,
                          status: 'completed',
                          conclusion,
                          output: { title, summary }
                      });

                      fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

                      if (hasFailed) {
                          const reasons = [];
                          if (totalFailures > 0) reasons.push(`${totalFailures} test(s) failed`);
                          if (testStepFailed) reasons.push('test command failed');
                          if (missingPackages.length > 0) {
                              reasons.push(`${missingPackages.length} package(s) produced no JUnit results`);
                          }
                          core.setFailed(reasons.join('; '));
                      }
            - name: Fail if tests failed
              if: steps.test.outcome == 'failure'
              run: exit 1

    valdres-package:
        name: Valdres published-package gate
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Detect package and publishing changes
              if: github.event_name == 'pull_request'
              id: changes
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      package:
                        - 'packages/valdres/**'
                        - 'packages/valdres-react/**'
                        - '.changeset/config.json'
                        - 'scripts/check-valdres-package.ts'
                        - 'scripts/test-v1-beta-packed-consumer.ts'
                        - 'scripts/check-package-size.ts'
                        - 'scripts/size-baseline.json'
                        - 'scripts/prepack.ts'
                        - 'scripts/postpublish.ts'
                        - 'scripts/publish-metadata.ts'
                        - 'scripts/rewrite-declaration-imports.ts'
                        - 'scripts/verify-publish.ts'
                        - 'scripts/ci-publish.sh'
                        - 'package.json'
                        - 'bun.lock'
                        - '.github/workflows/ci.yaml'
            - uses: oven-sh/setup-bun@v2
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              with:
                  bun-version: 1.4.0
            - uses: actions/setup-node@v6
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              with:
                  # Active Node LTS; the smoke check runs this executable.
                  node-version: "24.16"
            - name: Install
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              run: bun install --frozen-lockfile
            - name: Prove red, then validate the single npm tarball
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              # Builds valdres, invokes npm pack once, proves every validator
              # rejects its targeted mutation, then runs the intact artifact
              # through publint, ATTW, TS resolution, Node/Bun runtime smokes,
              # browser/worker-target consumer builds, and committed budgets.
              run: bun run scripts/check-valdres-package.ts --build --self-test
            - name: Validate packed v1-beta core and React consumers
              if:
                  github.event_name != 'pull_request' ||
                  steps.changes.outputs.package == 'true'
              # Shadow-packs the checked-in core and React beta manifests without
              # mutating them, then installs those exact versions with React 18
              # and 19 across Node, Bun, TypeScript, esbuild, and SSR.
              run: bun run test:v1-beta:packed

    publish:
        needs: [test, valdres-package]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-22.04
        environment: npm-publish
        permissions:
            checks: write
            contents: write
            pull-requests: write
            # OIDC: lets npm mint a short-lived, per-run publish credential via
            # trusted publishing instead of a long-lived NPM_TOKEN. Also enables
            # automatic provenance attestations on the published tarballs.
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  # Match the test job / Bencher runners so the frozen-lockfile
                  # gate sees identical lockfile behavior across both lanes.
                  bun-version: 1.4.0

            - uses: actions/setup-node@v6
              with:
                  # `changeset publish` shells out to the `npm` on PATH; pin the
                  # engine here rather than inheriting the runner image's default.
                  node-version: "24.16"

            - name: Ensure npm supports OIDC trusted publishing
              # Trusted publishing (OIDC) needs npm >= 11.5.1, newer than the CLI
              # bundled with Node 24.16. Upgrade the global npm that
              # `changeset publish` invokes and print the resolved version so the
              # log shows the CLI actually cleared the floor.
              run: |
                  npm install -g npm@latest
                  npm --version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build certified v1-beta packages
              run: bun run build

            - name: Build types
              run: bun run build:types

            - name: Verify publish pipeline
              run: bun run verify-publish

            - name: Create Release Pull Request or Publish
              id: changesets
              # No npm auth is configured: publishing authenticates via OIDC
              # trusted publishing (see the job's `id-token: write` permission),
              # so npm exchanges the GitHub-issued token for a one-time,
              # per-package publish credential. Each published package must have
              # a matching trusted publisher registered on npmjs.com
              # (repo eigilsagafos/valdres, workflow .github/workflows/ci.yaml,
              # environment npm-publish). Brand-new package names still need a
              # one-off manual first publish before OIDC can take over.
              uses: changesets/action@v2
              with:
                  version-script: bun run version-packages
                  publish-script: bash scripts/ci-publish.sh
                  # v2 defaults to pushing the release commit and tags through
                  # the GitHub API, which never checks the release branch out
                  # locally. The benchmark-safe step below authorizes a commit
                  # only after reading it back from the local clone, so keep the
                  # Git CLI push mode v1 used.
                  push-with-git-cli: true
                  # v2 dropped the GITHUB_TOKEN environment variable: a token
                  # only counts when passed through this input.
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # Pull requests created with GITHUB_TOKEN can require approval and
            # do not reliably emit the workflow_run event used by the trusted
            # benchmark gate. Version PRs cannot affect runtime performance,
            # so pre-authorize only the exact commit after proving that every
            # changed path is generated release metadata.
            - name: Mark generated release pull request benchmark-safe
              if: steps.changesets.outputs.pr-number != ''
              uses: actions/github-script@v9
              env:
                  RELEASE_PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
              with:
                  script: |
                      const pullNumber = Number(process.env.RELEASE_PR_NUMBER);
                      if (!Number.isSafeInteger(pullNumber) || pullNumber <= 0) {
                          throw new Error('Changesets returned an invalid pull request number');
                      }

                      const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
                      const [{ stdout: shaOutput }, { stdout: branchOutput }] = await Promise.all([
                          exec.getExecOutput('git', ['rev-parse', 'HEAD'], { silent: true }),
                          exec.getExecOutput('git', ['branch', '--show-current'], { silent: true })
                      ]);
                      const releaseSha = shaOutput.trim();
                      const releaseBranch = branchOutput.trim();
                      if (!/^[0-9a-f]{40}$/i.test(releaseSha) ||
                          releaseBranch !== 'changeset-release/main') {
                          throw new Error('Changesets did not leave the trusted release commit checked out');
                      }

                      // The force-push can become visible through the Git ref API
                      // before the pull-request API refreshes its cached head SHA.
                      // Require both views to converge on the exact local commit.
                      let converged = false;
                      let lastPullSha = 'unknown';
                      let lastRefSha = 'unknown';
                      for (let attempt = 1; attempt <= 15; attempt++) {
                          const [pullResponse, refResponse] = await Promise.all([
                              github.rest.pulls.get({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  pull_number: pullNumber
                              }),
                              github.rest.git.getRef({
                                  owner: context.repo.owner,
                                  repo: context.repo.repo,
                                  ref: 'heads/changeset-release/main'
                              })
                          ]);
                          const candidate = pullResponse.data;
                          const branch = refResponse.data;
                          lastPullSha = candidate.head.sha;
                          lastRefSha = branch.object.sha;
                          if (candidate.state !== 'open' ||
                              candidate.base.ref !== 'main' ||
                              candidate.base.repo.full_name !== expectedRepository ||
                              candidate.head.repo.full_name !== expectedRepository ||
                              candidate.head.ref !== releaseBranch) {
                              throw new Error('Changesets pull request identity is not trusted');
                          }
                          if (candidate.head.sha === releaseSha &&
                              branch.object.type === 'commit' &&
                              branch.object.sha === releaseSha) {
                              converged = true;
                              break;
                          }
                          if (attempt < 15) {
                              await new Promise(resolve => setTimeout(resolve, 2000));
                          }
                      }
                      if (!converged) {
                          throw new Error(
                              `Changesets APIs did not converge on ${releaseSha}; ` +
                              `pull=${lastPullSha}, ref=${lastRefSha}`
                          );
                      }

                      const files = await github.paginate(
                          github.rest.pulls.listFiles,
                          {
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              pull_number: pullNumber,
                              per_page: 100
                          }
                      );
                      if (files.length === 0 || files.length > 500) {
                          throw new Error(`Unexpected generated release file count: ${files.length}`);
                      }
                      // Changesets v3 keeps prerelease changesets it has already
                      // versioned in `.changeset/pre/` instead of listing their
                      // ids in `pre.json`, so a release commit moves files into
                      // that folder as well.
                      const generatedReleasePath = path =>
                          path === '.changeset/pre.json' ||
                          /^\.changeset\/(?:pre\/)?[a-z0-9-]+\.md$/.test(path) ||
                          path === 'bun.lock' ||
                          /^packages\/(?:valdres|valdres-react)\/(?:CHANGELOG\.md|package\.json)$/.test(path);
                      const unexpected = files
                          .flatMap(file => [file.filename, file.previous_filename].filter(Boolean))
                          .filter(path => !generatedReleasePath(path));
                      if (unexpected.length > 0) {
                          throw new Error(
                              `Refusing benchmark check for non-release files: ${unexpected.join(', ')}`
                          );
                      }
                      if (!files.some(file => /\/package\.json$/.test(file.filename))) {
                          throw new Error('Generated release pull request has no package manifest');
                      }

                      await github.rest.checks.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          name: 'benchmark_pr',
                          head_sha: releaseSha,
                          status: 'completed',
                          conclusion: 'success',
                          details_url: `${context.serverUrl}/${expectedRepository}/actions/runs/${context.runId}`,
                          output: {
                              title: 'Generated release metadata only',
                              summary: 'Trusted main-branch workflow verified that this commit changes generated release metadata only.'
                          }
                      });
