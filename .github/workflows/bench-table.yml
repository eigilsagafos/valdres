# Refreshes the committed benchmark snapshots from Bencher's public API after
# each push/merge to main re-benchmarks:
#   - README.md comparison table          (scripts/gen-bench-table.ts)
#   - docs/content/bench-summary.json      (scripts/gen-bench-summary.ts)
# Triggered by the "Bencher (base)" workflow completing (rather than on: push)
# so the base lane has finished uploading the new numbers first — the snapshots
# then reflect the just-merged commit instead of lagging one behind. Also
# runnable on demand.
#
# The live, always-current view is bencher.dev/perf/valdres; these are committed
# snapshots. The generators only READ the public API, so no token / Bencher.dev
# environment is needed. (The docs summary step no-ops on branches without the
# docs site, so it's harmless until the docs land on main.)
name: Refresh benchmark snapshots

on:
    workflow_run:
        workflows: ["Bencher (base)"]
        types: [completed]
    workflow_dispatch:

permissions:
    checks: write
    contents: write

concurrency:
    group: bench-table
    cancel-in-progress: false

jobs:
    refresh:
        # Manual runs always proceed; workflow_run only after a successful base
        # run (don't refresh off a failed/partial upload).
        if:
            ${{ github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - name: Regenerate README benchmark table
              run: bun run scripts/gen-bench-table.ts
            - name: Regenerate docs benchmark summary
              run: bun run scripts/gen-bench-summary.ts
            - name: Commit if changed
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git add README.md
                  [ -f docs/content/bench-summary.json ] && git add docs/content/bench-summary.json
                  if git diff --cached --quiet; then
                      echo "Benchmark snapshots unchanged."
                  else
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git commit -m "docs: refresh Bencher benchmark snapshots [skip ci]"

                      # A required check cannot be created for an unreachable
                      # commit. Publish the trusted docs-only commit on a
                      # temporary branch, mark that exact commit as safely
                      # skipped by the benchmark gate, then advance main.
                      holding_branch="automation/bench-snapshots-${GITHUB_RUN_ID}"
                      git push origin "HEAD:refs/heads/${holding_branch}"
                      gh api --method POST \
                        "repos/${GITHUB_REPOSITORY}/check-runs" \
                        -f name=benchmark_pr \
                        -f head_sha="$(git rev-parse HEAD)" \
                        -f status=completed \
                        -f conclusion=success \
                        -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                        -f 'output[title]=Generated benchmark snapshots only' \
                        -f 'output[summary]=Trusted main-branch workflow changed generated documentation only.'
                      git push origin HEAD:main
                      git push origin --delete "$holding_branch"
                  fi
