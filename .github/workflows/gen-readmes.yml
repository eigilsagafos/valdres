# Refreshes each publishable package's README.md from its co-located docs MDX
# (scripts/gen-readmes.ts) after docs or descriptions change on main. Generated
# content lives between <!-- DOCS:START --> / <!-- DOCS:END --> markers, so any
# hand-written prose outside them is preserved. Mirrors bench-table.yml: commits
# the refreshed snapshot back to main with [skip ci]. Also runnable on demand.
name: Refresh package READMEs

on:
    push:
        branches: [main]
        paths:
            - "packages/**/*.mdx"
            - "packages/**/package.json"
            - "scripts/gen-readmes.ts"
            - "scripts/lib/readme-sources.ts"
            - "scripts/lib/mdx-to-markdown.ts"
    workflow_dispatch:

permissions:
    checks: write
    contents: write

concurrency:
    group: gen-readmes
    cancel-in-progress: false

jobs:
    refresh:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile
            - name: Regenerate package READMEs
              run: bun run scripts/gen-readmes.ts
            - name: Commit if changed
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git add README.md packages/*/README.md packages/@valdres/*/README.md packages/@valdres-react/*/README.md 2>/dev/null || true
                  if git diff --cached --quiet; then
                      echo "READMEs unchanged."
                  else
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git commit -m "docs: refresh package READMEs [skip ci]"

                      # Pre-authorize this trusted generated-docs commit on a
                      # temporary ref before the required check protects main.
                      holding_branch="automation/package-readmes-${GITHUB_RUN_ID}"
                      git push origin "HEAD:refs/heads/${holding_branch}"
                      gh api --method POST \
                        "repos/${GITHUB_REPOSITORY}/check-runs" \
                        -f name=benchmark_pr \
                        -f head_sha="$(git rev-parse HEAD)" \
                        -f status=completed \
                        -f conclusion=success \
                        -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                        -f 'output[title]=Generated package READMEs only' \
                        -f 'output[summary]=Trusted main-branch workflow changed generated documentation only.'
                      git push origin HEAD:main
                      git push origin --delete "$holding_branch"
                  fi
