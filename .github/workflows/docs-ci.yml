name: Closed cursor reproduction (no release)
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    reproduce:
        runs-on: ubuntu-22.04
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - uses: actions/setup-node@v6
              with:
                  node-version: "24.16.0"
            - name: Install unchanged lockfile
              run: bun install --frozen-lockfile
            - name: Build identical unminified source graph for both engines
              run: |
                  bun build packages/valdres/src/index.ts --target=node --sourcemap=external --outdir=packages/test/diagnostics/closed-cursor-repro
                  mv packages/test/diagnostics/closed-cursor-repro/index.js packages/test/diagnostics/closed-cursor-repro/valdres.mjs
                  sha256sum packages/test/diagnostics/closed-cursor-repro/valdres.mjs
            - name: Fixed 11 source-layout processes (child failures are preserved evidence)
              run: python3 packages/test/diagnostics/closed-cursor-repro/run-source.py /tmp/closed-cursor-reproduction
            - name: Preserve exact source and built comparison artifact
              if: always()
              run: |
                  mkdir -p /tmp/closed-cursor-reproduction/source
                  cp -R packages/test/diagnostics/closed-cursor-repro/. /tmp/closed-cursor-reproduction/source/
                  git diff 348c943f4a3c73fca170de766776aed4b471c344 HEAD > /tmp/closed-cursor-reproduction/diagnostic.patch
                  git rev-parse HEAD > /tmp/closed-cursor-reproduction/sha.txt
            - name: Upload all observations, including failed children
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: closed-cursor-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
                  path: /tmp/closed-cursor-reproduction
                  retention-days: 14
