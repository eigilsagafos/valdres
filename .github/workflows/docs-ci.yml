name: Retention runner boundary (diagnostic only)
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    investigate:
        runs-on: ubuntu-22.04
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - uses: actions/setup-node@v6
              with:
                  node-version: "24.16.0"
            - name: Install pinned lockfile
              run: bun install --frozen-lockfile
            - name: Prepare self-contained portable reproduction
              run: |
                  python3 packages/test/diagnostics/runner-source/make-portable.py /tmp/runner-upstream-portable
                  tar -czf /tmp/runner-upstream-portable.tar.gz -C /tmp runner-upstream-portable
            - name: Fixed phase B portable cases (child failures are evidence)
              run: python3 /tmp/runner-upstream-portable/packages/test/diagnostics/runner-source/run-portable.py /tmp/retention-runner-boundary native
            - name: Preserve exact diagnostic source and delta
              if: always()
              run: |
                  mkdir -p /tmp/retention-runner-boundary/source
                  cp -R packages/test/diagnostics/runner-source/. /tmp/retention-runner-boundary/source/
                  cp -R packages/valdres/test/retention /tmp/retention-runner-boundary/fixtures
                  cp /tmp/runner-upstream-portable.tar.gz /tmp/retention-runner-boundary/
                  cp /tmp/runner-upstream-portable/SOURCE.json /tmp/retention-runner-boundary/portable-source.json
                  git diff 348c943f4a3c73fca170de766776aed4b471c344 HEAD > /tmp/retention-runner-boundary/diagnostic.patch
                  git rev-parse HEAD > /tmp/retention-runner-boundary/head.txt
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: retention-runner-boundary-${{ github.run_id }}-${{ github.run_attempt }}
                  path: /tmp/retention-runner-boundary
                  retention-days: 14
