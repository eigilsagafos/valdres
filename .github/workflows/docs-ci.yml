name: Retention Bun versions (diagnostic only)
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    compare:
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - name: Fixed 32-process comparison (child failures are evidence)
              run: python3 packages/test/diagnostics/bun-versions/run.py /tmp/retention-bun-versions
            - name: Preserve orchestration and exact delta
              if: always()
              run: |
                  mkdir -p /tmp/retention-bun-versions/orchestration
                  cp -R packages/test/diagnostics/bun-versions/. /tmp/retention-bun-versions/orchestration/
                  git diff 348c943f4a3c73fca170de766776aed4b471c344 HEAD > /tmp/retention-bun-versions/diagnostic.patch
                  git rev-parse HEAD > /tmp/retention-bun-versions/head.txt
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: retention-bun-versions-${{ github.run_id }}-${{ github.run_attempt }}
                  path: /tmp/retention-bun-versions
                  retention-days: 14
