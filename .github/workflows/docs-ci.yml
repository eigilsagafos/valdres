# The public site still targets the legacy framework/API surface. Keep its full
# build available to maintainers while the isolated v1 beta certifies only core
# and React; ordinary PRs retain the generated-README check in ci.yaml.
name: Docs

on:
    workflow_dispatch:

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docs:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - name: Install
              run: bun install --frozen-lockfile
            - name: Build docs site
              run: bun run docs:build
            - name: READMEs in sync with docs MDX
              run: bun run scripts/gen-readmes.ts --check
