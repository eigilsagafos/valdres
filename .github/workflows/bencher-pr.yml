# Bencher PR lane — Relative Continuous Benchmarking.
#
# Instead of comparing the PR against main's HISTORICAL latency (measured on
# other, possibly faster/slower runners — the source of the whole-board
# false-positive regressions), this lane measures BOTH the base SHA and the PR
# head on the SAME runner in the SAME job, then gates the PR against that
# same-runner baseline. A loaded/slow runner slows base and PR equally, so the
# global-slowdown noise cancels out and only a genuine per-benchmark regression
# trips the gate. This is Bencher's documented approach for noisy shared CI
# runners: https://bencher.dev/docs/how-to/track-benchmarks/ ("Relative
# Continuous Benchmarking").
#
# The historical trend for main is still recorded separately by bencher-base.yml
# on push; this lane never touches the `main` branch's data — it seeds the base
# measurement onto the PR branch and resets that scratch branch every run.
#
# Same-repo PRs only (the `if` guard): fork PRs get no secrets, so the project
# key would be empty. To cover external contributors, upgrade to Bencher's
# fork-safe 3-workflow pattern (run on pull_request -> artifact -> upload on
# workflow_run): https://bencher.dev/docs/how-to/github-actions/
name: Bencher (PR)

on:
    pull_request:
        branches: [main]

permissions:
    pull-requests: write
    checks: write

concurrency:
    group: bencher-pr-${{ github.ref }}
    cancel-in-progress: true

jobs:
    benchmark_pr:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-22.04
        # BENCHER_API_KEY lives in the `Bencher.dev` GitHub Environment, so the
        # job must target that environment to read it. (Environment has no branch
        # policy, so PR-branch jobs can still access the secret.)
        environment: Bencher.dev
        env:
            BENCHER_PROJECT: valdres
            # bencher_run_* is a PROJECT-scoped API key -> BENCHER_API_KEY / --key
            # (NOT --token, which only accepts a user JWT). Stored as the
            # BENCHER_API_KEY secret in the `Bencher.dev` GitHub Environment.
            BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        steps:
            # fetch-depth: 0 so we can build the PR's base SHA in a worktree.
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - uses: actions/setup-node@v6
              with:
                  node-version: "24.16.0"
            - uses: bencherdev/bencher@v0.6.6

            # Install both checkouts up front so the PR and base benchmark runs
            # happen back-to-back (no heavy install between them to skew timing).
            - name: Install (PR)
              run: bun install --frozen-lockfile
            - name: Build base SHA with the PR benchmark harness
              run: |
                  git worktree add --detach /tmp/base '${{ github.event.pull_request.base.sha }}'
                  (cd /tmp/base && bun install --frozen-lockfile)
                  cp "${GITHUB_WORKSPACE}/packages/valdres/test/performance/architecture.timing.ts" /tmp/base/packages/valdres/test/performance/architecture.timing.ts
                  cp "${GITHUB_WORKSPACE}/packages/valdres/test/performance/asyncSettlement.timing.ts" /tmp/base/packages/valdres/test/performance/asyncSettlement.timing.ts
                  cp "${GITHUB_WORKSPACE}/packages/valdres/test/performance/benchmark-result-schema.ts" /tmp/base/packages/valdres/test/performance/benchmark-result-schema.ts
                  cp "${GITHUB_WORKSPACE}/packages/valdres/test/performance/bench-utils.ts" /tmp/base/packages/valdres/test/performance/bench-utils.ts
                  cp "${GITHUB_WORKSPACE}/packages/valdres/vitest.architecture-bench.config.ts" /tmp/base/packages/valdres/vitest.architecture-bench.config.ts
                  cp "${GITHUB_WORKSPACE}/packages/valdres/vitest.async-bench.config.ts" /tmp/base/packages/valdres/vitest.async-bench.config.ts

            # Run the same benchmark harness against both implementations. New
            # target files are copied into the base worktree above, but their
            # relative imports still resolve to the base source. Targeted async
            # measurements run in their own process so Promise-heavy warm-up
            # cannot alter Bun's JIT profile for the standard synchronous suite.
            #
            # Each runtime gets three base/PR pairs in alternating B-P, P-B, B-P
            # order. Every suite invocation is a fresh process. The converter
            # gates the SMALLEST of each benchmark's three paired PR/base ratios,
            # which controls order, thermal, GC, scheduler, and JIT-tier skew.
            #
            # BENCH_VALDRES_ONLY skips the jotai/map reference measurements — the
            # gate is valdres-only, so measuring them here is wasted time. The
            # copied benchmark harness gives both worktrees identical support for
            # this flag and the versioned observation schema.
            - name: Run interleaved base/PR benchmarks (Bun + Node, 3×)
              run: |
                  set -euo pipefail
                  rm -f \
                    /tmp/base_bun.ndjson \
                    /tmp/base_node.ndjson \
                    /tmp/pr_bun.ndjson \
                    /tmp/pr_node.ndjson

                  run_suite() {
                    local pair="$1"
                    local runtime="$2"
                    local suite="$3"
                    local side="$4"
                    local order="$5"
                    local checkout
                    local output
                    local result

                    if [[ "$side" == "base" ]]; then
                      checkout="/tmp/base/packages/valdres"
                      output="/tmp/base_${runtime}.ndjson"
                    else
                      checkout="${GITHUB_WORKSPACE}/packages/valdres"
                      output="/tmp/pr_${runtime}.ndjson"
                    fi

                    if [[ "$runtime" == "bun" ]]; then
                      result="test/performance/bench-results.ndjson"
                    else
                      result="test/performance/bench-results-node.ndjson"
                    fi

                    (
                      cd "$checkout"
                      export BENCH_PAIR_ID="${pair}-${runtime}-${suite}"
                      export BENCH_SIDE="$side"
                      export BENCH_ORDER="$order"
                      export BENCH_SUITE="$suite"
                      if [[ "$suite" == "standard" ]]; then
                        if [[ "$runtime" == "bun" ]]; then
                          BENCH_VALDRES_ONLY=1 bun run test:bench
                        else
                          BENCH_VALDRES_ONLY=1 bun run test:bench:node
                        fi
                      elif [[ "$runtime" == "bun" ]]; then
                        rm -f "$result"
                        BENCH_VALDRES_ONLY=1 NODE_ENV=production \
                          bun test --timeout 60000 --concurrency 1 \
                          ./test/performance/asyncSettlement.timing.ts
                      else
                        rm -f "$result"
                        BENCH_VALDRES_ONLY=1 NODE_ENV=production \
                          npx vitest run --config vitest.async-bench.config.ts
                      fi
                      cat "$result" >> "$output"
                    )
                  }

                  for pair in 1 2 3; do
                    if [[ "$pair" == "2" ]]; then
                      pair_order=(head base)
                    else
                      pair_order=(base head)
                    fi

                    for runtime in bun node; do
                      for suite in standard async; do
                        order=0
                        for side in "${pair_order[@]}"; do
                          order=$((order + 1))
                          run_suite "$pair" "$runtime" "$suite" "$side" "$order"
                        done
                      done
                    done
                  done

            # Convert both sides with the PR-checkout script. The copied harness
            # emits the same versioned schema from both worktrees, and conversion
            # pairs explicit benchmark + pair IDs rather than NDJSON position.
            # The base upload is its median latency; each PR value is that base
            # median scaled by the smallest of the three paired PR/base ratios.
            # That lets Bencher apply its percentage threshold to the paired
            # statistic directly.
            # BENCH_EXCLUDE_REFS drops the jotai/map reference sides: they can't
            # regress from a valdres change, so gating them only adds noise
            # (every false positive we saw was a reference bench). They're still
            # measured + plotted via the base lane for the head-to-head perf page.
            #
            # BENCH_EXCLUDE_TINY additionally drops nanosecond-scale ops whose
            # +50% boundary is below the runner's JIT/noise floor. All are still
            # measured and plotted by the base lane — tracked, just not blocking.
            - name: Convert base + paired PR results -> BMF (valdres-only)
              env:
                  BENCH_EXCLUDE_REFS: "1"
                  BENCH_EXCLUDE_TINY: "1"
              run: |
                  BENCH_NDJSON_BUN=/tmp/base_bun.ndjson \
                  BENCH_NDJSON_NODE=/tmp/base_node.ndjson \
                  BENCH_OUT_BUN=/tmp/base_bun_results.json \
                  BENCH_OUT_NODE=/tmp/base_node_results.json \
                    bun run scripts/bench-to-bmf.ts
                  BENCH_NDJSON_BUN=/tmp/pr_bun.ndjson \
                  BENCH_NDJSON_NODE=/tmp/pr_node.ndjson \
                  BENCH_PAIRED_BASE_BUN=/tmp/base_bun.ndjson \
                  BENCH_PAIRED_BASE_NODE=/tmp/base_node.ndjson \
                  BENCH_OUT_BUN=/tmp/pr_bun_results.json \
                  BENCH_OUT_NODE=/tmp/pr_node_results.json \
                    bun run scripts/bench-to-bmf.ts

            # Keep compact identity + dispersion diagnostics available when a
            # benchmark flakes or the converter fails closed. Raw Mitata sample
            # arrays are never serialized into these files.
            - name: Upload benchmark observations
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-observations
                  path: |
                      /tmp/base_bun.ndjson
                      /tmp/base_node.ndjson
                      /tmp/pr_bun.ndjson
                      /tmp/pr_node.ndjson
                  if-no-files-found: warn
                  retention-days: 14

            # --- Seed the same-runner baseline onto the PR branch ---
            # --start-point-reset wipes the PR branch's prior data so each run is
            # self-contained, then the base measurement becomes its only history.
            # Reset happens ONCE (on the first upload); the branch Head is shared
            # across testbeds, so the Node base must NOT reset again or it would
            # wipe the Bun base point.
            - name: Seed relative baseline (base measurement)
              run: |
                  bencher run \
                    --branch '${{ github.head_ref }}' \
                    --start-point-reset \
                    --testbed ubuntu-2204-bun \
                    --adapter json \
                    --file /tmp/base_bun_results.json
                  bencher run \
                    --branch '${{ github.head_ref }}' \
                    --testbed ubuntu-2204-node \
                    --adapter json \
                    --file /tmp/base_node_results.json

            # --- Gate the PR against the same-runner baseline ---
            # Percentage test: alert if a benchmark is >50% slower than the base
            # measurement on THIS runner. Variance-independent and immune to the
            # cross-runner global-slowdown that flaked the old t-test gate. The
            # minimum of three paired ratios above filters runner interference
            # and accounts for order effects, so +50% is a trustworthy boundary
            # on both lanes. Interference is one-directional (a stall only ever
            # makes a sample slower), so the smallest ratio is the least
            # contaminated; a median only survived one bad pair in three, and
            # sub-microsecond benchmarks routinely lost two. A real same-runner
            # regression shifts every pair, so it is still caught. --err fails
            # on any alert.
            - name: Gate Bun PR vs base
              id: gate_bun
              continue-on-error: true
              run: |
                  bencher run \
                    --branch '${{ github.head_ref }}' \
                    --testbed ubuntu-2204-bun \
                    --threshold-measure latency \
                    --threshold-test percentage \
                    --threshold-upper-boundary 0.5 \
                    --thresholds-reset \
                    --err \
                    --adapter json \
                    --github-actions '${{ secrets.GITHUB_TOKEN }}' \
                    --file /tmp/pr_bun_results.json
            - name: Gate Node PR vs base
              id: gate_node
              continue-on-error: true
              run: |
                  bencher run \
                    --branch '${{ github.head_ref }}' \
                    --testbed ubuntu-2204-node \
                    --threshold-measure latency \
                    --threshold-test percentage \
                    --threshold-upper-boundary 0.5 \
                    --thresholds-reset \
                    --err \
                    --adapter json \
                    --github-actions '${{ secrets.GITHUB_TOKEN }}' \
                    --file /tmp/pr_node_results.json
            - name: Enforce benchmark gates
              if:
                  ${{ steps.gate_bun.outcome == 'failure' ||
                  steps.gate_node.outcome == 'failure' }}
              run: |
                  echo "::error::Benchmark alerts: Bun=${{ steps.gate_bun.outcome }}, Node=${{ steps.gate_node.outcome }}"
                  exit 1
