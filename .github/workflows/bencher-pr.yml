# Bencher PR lane — fast, blocking relative benchmark gate.
#
# Both the base commit and GitHub's checked-out test-merge commit run on one
# runner. Exactly three explicit pairs are measured in B-P, P-B, B-P order for
# Bun/Node and standard/async. The smallest paired head/base ratio feeds the
# existing +50% Bencher gates. Detailed statistical calibration lives in the
# non-required bencher-deep.yml workflow and cannot affect this check.
name: Bencher (PR)

on:
    pull_request:
        branches: [main]

permissions:
    pull-requests: write
    checks: write

# Every run for a PR mutates the same numeric scratch branch. Serialize those
# mutations and never cancel a run between reset and upload.
concurrency:
    group: bencher-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    benchmark_pr:
        if:
            ${{ github.event.pull_request.head.repo.full_name ==
            github.repository && github.actor != 'dependabot[bot]' }}
        runs-on: ubuntu-22.04
        environment: Bencher.dev
        steps:
            # pull_request checkout intentionally measures GitHub's test-merge
            # commit. The base SHA is built separately in a worktree below.
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - uses: actions/setup-node@v6
              with:
                  node-version: "24.16.0"
            - uses: bencherdev/bencher@v0.6.6

            - name: Record execution context
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  TESTED_SHA: ${{ github.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  {
                    echo "base_sha=${BASE_SHA}"
                    echo "tested_test_merge_sha=${TESTED_SHA}"
                    echo "pull_request_number=${PR_NUMBER}"
                  } > /tmp/benchmark-context.txt

            # Install both checkouts before measurement so dependency setup
            # cannot introduce a long pause between paired processes.
            - name: Install tested test-merge commit
              run: bun install --frozen-lockfile
            - name: Build base SHA with the current benchmark harness
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  set -euo pipefail
                  git worktree add --detach /tmp/base "$BASE_SHA"
                  (cd /tmp/base && bun install --frozen-lockfile)
                  rsync -a --delete \
                    "$GITHUB_WORKSPACE/packages/valdres/test/performance/" \
                    /tmp/base/packages/valdres/test/performance/
                  cp \
                    "$GITHUB_WORKSPACE/packages/valdres/vitest.architecture-bench.config.ts" \
                    /tmp/base/packages/valdres/vitest.architecture-bench.config.ts
                  cp \
                    "$GITHUB_WORKSPACE/packages/valdres/vitest.async-bench.config.ts" \
                    /tmp/base/packages/valdres/vitest.async-bench.config.ts

            # Each suite invocation is a fresh process. Pair IDs, side/order
            # metadata, and the versioned schema make pairing fail closed.
            - name: Run interleaved base/test-merge benchmarks (Bun + Node, 3x)
              run: |
                  set -euo pipefail
                  rm -f \
                    /tmp/base_bun.ndjson \
                    /tmp/base_node.ndjson \
                    /tmp/head_bun.ndjson \
                    /tmp/head_node.ndjson

                  run_suite() {
                    local pair="$1"
                    local runtime="$2"
                    local suite="$3"
                    local side="$4"
                    local order="$5"
                    local checkout
                    local output
                    local result

                    if [[ "$side" == "base" ]]; then
                      checkout="/tmp/base/packages/valdres"
                      output="/tmp/base_${runtime}.ndjson"
                    else
                      checkout="${GITHUB_WORKSPACE}/packages/valdres"
                      output="/tmp/head_${runtime}.ndjson"
                    fi

                    if [[ "$runtime" == "bun" ]]; then
                      result="test/performance/bench-results.ndjson"
                    else
                      result="test/performance/bench-results-node.ndjson"
                    fi

                    (
                      cd "$checkout"
                      export BENCH_PAIR_ID="pair-${pair}-${runtime}-${suite}"
                      export BENCH_SIDE="$side"
                      export BENCH_ORDER="$order"
                      export BENCH_SUITE="$suite"
                      if [[ "$suite" == "standard" ]]; then
                        if [[ "$runtime" == "bun" ]]; then
                          BENCH_VALDRES_ONLY=1 bun run test:bench
                        else
                          BENCH_VALDRES_ONLY=1 bun run test:bench:node
                        fi
                      elif [[ "$runtime" == "bun" ]]; then
                        rm -f "$result"
                        BENCH_VALDRES_ONLY=1 NODE_ENV=production \
                          bun test --timeout 60000 --concurrency 1 \
                          ./test/performance/asyncSettlement.timing.ts
                      else
                        rm -f "$result"
                        BENCH_VALDRES_ONLY=1 NODE_ENV=production \
                          npx vitest run --config vitest.async-bench.config.ts
                      fi
                      cat "$result" >> "$output"
                    )
                  }

                  for pair in 1 2 3; do
                    if [[ "$pair" == "2" ]]; then
                      pair_order=(head base)
                    else
                      pair_order=(base head)
                    fi

                    for runtime in bun node; do
                      for suite in standard async; do
                        order=0
                        for side in "${pair_order[@]}"; do
                          order=$((order + 1))
                          run_suite "$pair" "$runtime" "$suite" "$side" "$order"
                        done
                      done
                    done
                  done

            # The converter validates exact pair identities and process blocks.
            # Its head value uses the smallest of exactly three paired ratios.
            - name: Convert base + paired test-merge results to BMF
              env:
                  BENCH_EXCLUDE_REFS: "1"
                  BENCH_EXCLUDE_TINY: "1"
              run: |
                  BENCH_NDJSON_BUN=/tmp/base_bun.ndjson \
                  BENCH_NDJSON_NODE=/tmp/base_node.ndjson \
                  BENCH_OUT_BUN=/tmp/base_bun_results.json \
                  BENCH_OUT_NODE=/tmp/base_node_results.json \
                    bun run scripts/bench-to-bmf.ts
                  BENCH_NDJSON_BUN=/tmp/head_bun.ndjson \
                  BENCH_NDJSON_NODE=/tmp/head_node.ndjson \
                  BENCH_PAIRED_BASE_BUN=/tmp/base_bun.ndjson \
                  BENCH_PAIRED_BASE_NODE=/tmp/base_node.ndjson \
                  BENCH_OUT_BUN=/tmp/head_bun_results.json \
                  BENCH_OUT_NODE=/tmp/head_node_results.json \
                    bun run scripts/bench-to-bmf.ts

            - name: Upload benchmark observations
              if: always()
              continue-on-error: true
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-observations
                  path: |
                      /tmp/base_bun.ndjson
                      /tmp/base_node.ndjson
                      /tmp/head_bun.ndjson
                      /tmp/head_node.ndjson
                      /tmp/benchmark-context.txt
                  if-no-files-found: warn
                  retention-days: 14

            # Reset only the first Bun seed. Bun and Node share one stable,
            # numeric per-PR Bencher branch, so resetting Node would erase Bun.
            - name: Seed relative baseline
              env:
                  BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
                  BENCHER_BRANCH: pr-${{ github.event.pull_request.number }}
                  BENCHER_PROJECT: valdres
              run: |
                  bencher run \
                    --branch "$BENCHER_BRANCH" \
                    --start-point-reset \
                    --testbed ubuntu-2204-bun \
                    --adapter json \
                    --file /tmp/base_bun_results.json
                  bencher run \
                    --branch "$BENCHER_BRANCH" \
                    --testbed ubuntu-2204-node \
                    --adapter json \
                    --file /tmp/base_node_results.json

            - name: Gate Bun test-merge vs base
              id: gate_bun
              continue-on-error: true
              env:
                  BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
                  BENCHER_BRANCH: pr-${{ github.event.pull_request.number }}
                  BENCHER_PROJECT: valdres
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  bencher run \
                    --branch "$BENCHER_BRANCH" \
                    --testbed ubuntu-2204-bun \
                    --threshold-measure latency \
                    --threshold-test percentage \
                    --threshold-upper-boundary 0.5 \
                    --thresholds-reset \
                    --err \
                    --adapter json \
                    --github-actions "$GH_TOKEN" \
                    --file /tmp/head_bun_results.json
            - name: Gate Node test-merge vs base
              id: gate_node
              continue-on-error: true
              env:
                  BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
                  BENCHER_BRANCH: pr-${{ github.event.pull_request.number }}
                  BENCHER_PROJECT: valdres
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  bencher run \
                    --branch "$BENCHER_BRANCH" \
                    --testbed ubuntu-2204-node \
                    --threshold-measure latency \
                    --threshold-test percentage \
                    --threshold-upper-boundary 0.5 \
                    --thresholds-reset \
                    --err \
                    --adapter json \
                    --github-actions "$GH_TOKEN" \
                    --file /tmp/head_node_results.json
            - name: Enforce benchmark gates
              if:
                  ${{ steps.gate_bun.outcome == 'failure' ||
                  steps.gate_node.outcome == 'failure' }}
              run: |
                  echo "::error::Benchmark alerts: Bun=${{ steps.gate_bun.outcome }}, Node=${{ steps.gate_node.outcome }}"
                  exit 1
