# Fork-safe Bencher workflow 2/3: untrusted pull-request measurement.
#
# Workflow 1 is bencher-base.yml. This workflow checks out and executes the PR
# (including forks) with read-only permissions and no secrets, then uploads raw
# observations. bencher-pr-gate.yml is workflow 3: it runs from the trusted
# default branch on workflow_run, re-analyzes this artifact, uploads it to
# Bencher, and writes the required check to the PR head SHA.
# Legacy-engine microbenchmarks; the packed v1 ShiftX gate lives in ci.yaml.
# https://bencher.dev/docs/how-to/github-actions/#pull-requests-from-forks
name: Bencher (PR measurement)

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, labeled]

permissions:
    contents: read

concurrency:
    group: bencher-pr-measure-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    classify_changes:
        runs-on: ubuntu-22.04
        outputs:
            run_benchmarks: ${{ steps.scope.outputs.run_benchmarks }}
        steps:
            # Classification deliberately uses the runner's preinstalled Node.
            # The classifier comes from the trusted base revision whenever it
            # exists, so a PR cannot edit itself into the cheap skip path.
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Classify exact base/head changes
              id: scope
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  BENCH_FORCE_RUN:
                      ${{ contains(github.event.pull_request.labels.*.name,
                      'run-benchmarks') }}
              run: |
                  set -euo pipefail
                  classifier=/tmp/benchmark-change-scope.mjs
                  if git cat-file -e \
                    "${BASE_SHA}:scripts/lib/benchmark-change-scope.mjs" 2>/dev/null; then
                    git show \
                      "${BASE_SHA}:scripts/lib/benchmark-change-scope.mjs" \
                      > "$classifier"
                  else
                    classifier="$GITHUB_WORKSPACE/scripts/lib/benchmark-change-scope.mjs"
                    echo "::notice::Using checked-out classifier for initial bootstrap"
                  fi
                  decision="$(
                    git diff \
                      --find-renames \
                      --find-copies \
                      --find-copies-harder \
                      --name-status \
                      -z \
                      "$BASE_SHA...$HEAD_SHA" \
                      -- | node "$classifier"
                  )"
                  if [[ "$decision" != "true" && "$decision" != "false" ]]; then
                    echo "::error::Invalid classifier output: ${decision}"
                    exit 1
                  fi
                  echo "run_benchmarks=${decision}" >> "$GITHUB_OUTPUT"

            # The privileged workflow treats every artifact byte as untrusted.
            # This minimal envelope is checked against workflow_run.head_sha and
            # the live pull request before its number reaches Bencher or an API.
            - name: Record pull-request context
              env:
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_BENCHMARKS: ${{ steps.scope.outputs.run_benchmarks }}
                  RUN_ID: ${{ github.run_id }}
                  TESTED_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  mkdir -p /tmp/benchmark-context
                  jq -n \
                    --arg repository "$REPOSITORY" \
                    --argjson pr_number "$PR_NUMBER" \
                    --arg base_ref "$BASE_REF" \
                    --arg base_sha "$BASE_SHA" \
                    --arg head_sha "$HEAD_SHA" \
                    --arg tested_sha "$TESTED_SHA" \
                    --argjson run_id "$RUN_ID" \
                    --arg run_benchmarks "$RUN_BENCHMARKS" \
                    '{
                      schemaVersion: 1,
                      repository: $repository,
                      prNumber: $pr_number,
                      baseRef: $base_ref,
                      baseSha: $base_sha,
                      headSha: $head_sha,
                      testedTestMergeSha: $tested_sha,
                      runId: $run_id,
                      runBenchmarks: ($run_benchmarks == "true")
                    }' > /tmp/benchmark-context/context.json
            - name: Upload pull-request context
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-context
                  path: /tmp/benchmark-context/context.json
                  if-no-files-found: error
                  retention-days: 14

    run_benchmarks:
        needs: classify_changes
        if:
            ${{ needs.classify_changes.result == 'success' &&
            needs.classify_changes.outputs.run_benchmarks == 'true' }}
        runs-on: ubuntu-22.04
        timeout-minutes: 120
        steps:
            # pull_request checkout measures GitHub's test-merge commit. The
            # exact event base SHA is built separately in a worktree below.
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - uses: actions/setup-node@v6
              with:
                  node-version: "24.16.0"

            - name: Install tested test-merge commit
              run: bun install --frozen-lockfile
            - name: Build base SHA with the current benchmark harness
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  set -euo pipefail
                  git worktree add --detach /tmp/base "$BASE_SHA"
                  (cd /tmp/base && bun install --frozen-lockfile)
                  rsync -a --delete \
                    "$GITHUB_WORKSPACE/packages/valdres/test/performance/" \
                    /tmp/base/packages/valdres/test/performance/
                  cp \
                    "$GITHUB_WORKSPACE/packages/valdres/vitest.architecture-bench.config.ts" \
                    /tmp/base/packages/valdres/vitest.architecture-bench.config.ts
                  cp \
                    "$GITHUB_WORKSPACE/packages/valdres/vitest.async-bench.config.ts" \
                    /tmp/base/packages/valdres/vitest.async-bench.config.ts

            # Four-pair B-P-P-B rounds feed the calibrated paired model. Round
            # one always runs; only lanes with an inconclusive protected row get
            # rounds two and three. The first three round-one pairs are copied
            # separately for the unchanged +50% catastrophic Bencher backstop.
            - name: Run balanced base/head blocks with the rerun ladder
              env:
                  BENCH_MAX_ROUNDS: "3"
              run: |
                  set -euo pipefail
                  evidence=/tmp/benchmark-evidence
                  observations="$evidence/observations"
                  decisions="$evidence/decisions"
                  mkdir -p "$observations" "$decisions"
                  rm -f \
                    "$observations"/*.ndjson \
                    "$decisions"/*.json \
                    /tmp/paired-report.md \
                    /tmp/rerun-lanes

                  run_suite() {
                    local pair="$1"
                    local runtime="$2"
                    local suite="$3"
                    local side="$4"
                    local order="$5"
                    local catastrophic="$6"
                    local checkout
                    local result

                    if [[ "$side" == "base" ]]; then
                      checkout="/tmp/base/packages/valdres"
                    else
                      checkout="${GITHUB_WORKSPACE}/packages/valdres"
                    fi
                    if [[ "$runtime" == "bun" ]]; then
                      result="test/performance/bench-results.ndjson"
                    else
                      result="test/performance/bench-results-node.ndjson"
                    fi

                    (
                      cd "$checkout"
                      export BENCH_PAIR_ID="$pair"
                      export BENCH_SIDE="$side"
                      export BENCH_ORDER="$order"
                      export BENCH_SUITE="$suite"
                      if [[ "$suite" == "standard" ]]; then
                        if [[ "$runtime" == "bun" ]]; then
                          BENCH_VALDRES_ONLY=1 bun run test:bench
                        else
                          BENCH_VALDRES_ONLY=1 bun run test:bench:node
                        fi
                      elif [[ "$runtime" == "bun" ]]; then
                        rm -f "$result"
                        BENCH_VALDRES_ONLY=1 NODE_ENV=production \
                          bun test --timeout 60000 --concurrency 1 \
                          ./test/performance/asyncSettlement.timing.ts
                      else
                        rm -f "$result"
                        BENCH_VALDRES_ONLY=1 NODE_ENV=production \
                          npx vitest run --config vitest.async-bench.config.ts
                      fi
                      cat "$result" >> "$observations/all_${side}_${runtime}.ndjson"
                      if [[ "$catastrophic" == "1" ]]; then
                        cat "$result" >> "$observations/gate_${side}_${runtime}.ndjson"
                      fi
                    )
                  }

                  run_block() {
                    local round="$1"
                    local block="$2"
                    local runtime="$3"
                    local suite="$4"
                    local gate_a="$5"
                    local gate_b="$6"
                    local a="r${round}b${block}a-${runtime}-${suite}"
                    local b="r${round}b${block}b-${runtime}-${suite}"
                    run_suite "$a" "$runtime" "$suite" base 1 "$gate_a"
                    run_suite "$a" "$runtime" "$suite" head 2 "$gate_a"
                    run_suite "$b" "$runtime" "$suite" head 1 "$gate_b"
                    run_suite "$b" "$runtime" "$suite" base 2 "$gate_b"
                  }

                  run_round() {
                    local round="$1"
                    local runtime="$2"
                    local suite="$3"
                    local gate=0
                    if [[ "$round" == "1" ]]; then gate=1; fi
                    run_block "$round" 1 "$runtime" "$suite" "$gate" "$gate"
                    run_block "$round" 2 "$runtime" "$suite" "$gate" 0
                  }

                  analyze_round() {
                    local round="$1"
                    BENCH_ROUND="$round" \
                    BENCH_MAX_ROUNDS="$BENCH_MAX_ROUNDS" \
                    BENCH_PAIRED_BASE_BUN="$observations/all_base_bun.ndjson" \
                    BENCH_PAIRED_HEAD_BUN="$observations/all_head_bun.ndjson" \
                    BENCH_PAIRED_BASE_NODE="$observations/all_base_node.ndjson" \
                    BENCH_PAIRED_HEAD_NODE="$observations/all_head_node.ndjson" \
                    BENCH_REPORT_JSON="$decisions/round-${round}.json" \
                    BENCH_REPORT_MD=/tmp/paired-report.md \
                    BENCH_RERUN_LANES_FILE=/tmp/rerun-lanes \
                      bun run scripts/bench-paired-report.ts > /dev/null
                  }

                  for runtime in bun node; do
                    for suite in standard async; do
                      run_round 1 "$runtime" "$suite"
                    done
                  done

                  completed=1
                  while true; do
                    analyze_round "$completed"
                    lanes="$(cat /tmp/rerun-lanes)"
                    if [[ -z "$lanes" || "$completed" -ge "$BENCH_MAX_ROUNDS" ]]; then
                      cp /tmp/paired-report.md "$evidence/paired-report.md"
                      cp "$decisions/round-${completed}.json" \
                        "$evidence/paired-report.json"
                      echo "$completed" > "$evidence/completed-round.txt"
                      break
                    fi
                    round=$((completed + 1))
                    echo "::notice::Round ${round}: adding pairs for ${lanes}"
                    for lane in $lanes; do
                      run_round "$round" "${lane%%:*}" "${lane##*:}"
                    done
                    completed="$round"
                  done

            - name: Publish measurement report
              if: always()
              run: |
                  if [[ -f /tmp/benchmark-evidence/paired-report.md ]]; then
                    cat /tmp/benchmark-evidence/paired-report.md \
                      >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "_No complete paired report was produced._" \
                      >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Upload raw benchmark evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-evidence
                  path: /tmp/benchmark-evidence/
                  if-no-files-found: warn
                  retention-days: 14
