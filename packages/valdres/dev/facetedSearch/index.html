<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>valdres — faceted movie search</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f4f5f7;
                --panel: #ffffff;
                --fg: #1c1e26;
                --muted: #6b7280;
                --border: #e3e5ea;
                --accent: #5468ff;
                --accent-fg: #fff;
                --chip: #eef0ff;
                --mark: #fff3a8;
                --tag: #eef1f6;
                --star: #f5a623;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0f1115;
                    --panel: #181a20;
                    --fg: #e7e9ee;
                    --muted: #9aa0ab;
                    --border: #262a33;
                    --chip: #232744;
                    --mark: #6b5d10;
                    --tag: #21242c;
                }
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                line-height: 1.5;
            }
            .topbar {
                position: sticky;
                top: 0;
                z-index: 5;
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.85rem 1.25rem;
                background: var(--panel);
                border-bottom: 1px solid var(--border);
            }
            .brand { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
            .searchbox {
                flex: 1;
                font: inherit;
                font-size: 1rem;
                padding: 0.6rem 0.9rem;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: var(--bg);
                color: inherit;
                outline: none;
            }
            .searchbox:focus { border-color: var(--accent); }
            .clear {
                font: inherit;
                border: 1px solid var(--border);
                background: var(--bg);
                color: var(--muted);
                border-radius: 10px;
                padding: 0.55rem 0.8rem;
                cursor: pointer;
            }
            .layout {
                display: grid;
                grid-template-columns: 250px 1fr;
                gap: 1.25rem;
                max-width: 1180px;
                margin: 1.25rem auto;
                padding: 0 1.25rem;
            }
            @media (max-width: 720px) {
                .layout { grid-template-columns: 1fr; }
            }
            .sidebar { display: flex; flex-direction: column; gap: 1rem; }
            .facet {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 0.85rem 1rem;
            }
            .facet h3 {
                margin: 0 0 0.6rem;
                font-size: 0.72rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .facet-search {
                width: 100%;
                font: inherit;
                font-size: 0.85rem;
                padding: 0.4rem 0.6rem;
                margin-bottom: 0.5rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--bg);
                color: inherit;
                outline: none;
            }
            .refinements { list-style: none; margin: 0; padding: 0; }
            .refinements label {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.2rem 0;
                font-size: 0.9rem;
                cursor: pointer;
                user-select: none;
            }
            .refinements input { accent-color: var(--accent); }
            .ref-label { flex: 1; }
            .refinements label.sel .ref-label { font-weight: 600; }
            .count {
                font-size: 0.75rem;
                color: var(--muted);
                background: var(--bg);
                border-radius: 999px;
                padding: 0.05rem 0.5rem;
                min-width: 1.8rem;
                text-align: center;
            }
            .count.zero { opacity: 0.4; }
            .show-more {
                margin-top: 0.45rem;
                font: inherit;
                font-size: 0.82rem;
                background: none;
                border: none;
                color: var(--accent);
                cursor: pointer;
                padding: 0;
            }
            .stars { color: var(--star); white-space: nowrap; letter-spacing: 0.02em; }
            .rating-num { color: var(--muted); font-size: 0.78rem; margin-left: 0.35rem; }
            .results { min-width: 0; }
            .results-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                margin-bottom: 0.5rem;
            }
            .stat { font-size: 1rem; }
            .muted { color: var(--muted); }
            .sort { font-size: 0.85rem; color: var(--muted); }
            .sort select {
                font: inherit;
                font-size: 0.85rem;
                padding: 0.35rem 0.5rem;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: var(--panel);
                color: inherit;
            }
            .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
            .chip {
                font: inherit;
                font-size: 0.8rem;
                background: var(--chip);
                color: var(--accent);
                border: none;
                border-radius: 999px;
                padding: 0.25rem 0.65rem;
                cursor: pointer;
            }
            .chip.clear-all { background: transparent; color: var(--muted); text-decoration: underline; }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 0.85rem;
            }
            .card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 0.85rem 0.95rem;
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }
            .card-head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; }
            .card-head h4 { margin: 0; font-size: 0.98rem; line-height: 1.25; }
            .card-meta { font-size: 0.8rem; color: var(--muted); }
            .card-genres { display: flex; flex-wrap: wrap; gap: 0.3rem; }
            .tag {
                font-size: 0.72rem;
                background: var(--tag);
                color: var(--muted);
                border-radius: 6px;
                padding: 0.1rem 0.45rem;
            }
            .card-cast { font-size: 0.78rem; color: var(--muted); }
            mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 0.1rem; }
            .empty { color: var(--muted); font-style: italic; padding: 2rem 0; text-align: center; }
            .pagination {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 1rem;
                margin: 1.5rem 0 0.5rem;
            }
            .pagination button {
                font: inherit;
                padding: 0.45rem 0.9rem;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: var(--panel);
                color: inherit;
                cursor: pointer;
            }
            .pagination button:disabled { opacity: 0.4; cursor: default; }
            .page-info { font-size: 0.85rem; color: var(--muted); }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script>
            // Skip valdres' dev-mode deepFreeze for snappier seeding of 5k rows.
            globalThis.__valdres_dev_skip_freeze__ = true
            window.process = window.process || { env: { VALDRES_VERSION: "demo" } }
        </script>
        <script type="module" src="./index.tsx"></script>
    </body>
</html>
